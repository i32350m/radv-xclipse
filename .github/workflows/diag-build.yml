name: Diagnostic build (Xclipse 940)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools ninja-build
          pip install meson mako packaging pyyaml

      - name: Apply diagnostic patch
        run: python3 patch_940c.py

      - name: Build
        run: ./build.sh "$ANDROID_NDK_LATEST_HOME"

      - uses: actions/upload-artifact@v4
        with:
          name: radv-xclipse-940-diag
          path: dist/*.zip
